## Reduces Cell count from 9 to 5 and speed up enemy progression.
# Setting type: Boolean
# Default value: true
Less Cells = true

[07. Moon]

## Increase radius of holdout zone.
# Setting type: Boolean
# Default value: true
Larger Holdout Zone = true

## Reduce the amount of pillars required to activate the jump pads.
# Setting type: Boolean
# Default value: true
Reduce Pillar Count = true

[08. Void Locus]

## Removes Void Fog from the map.
# Setting type: Boolean
# Default value: false
Remove Fog = true

## Increase radius of holdout zone.
# Setting type: Boolean
# Default value: true
Larger Holdout Zone = true

[99. Misc Tweaks]

## Homing projectiles target based on angle, instead of distance + angle.
# Setting type: Boolean
# Default value: true
Better Projectile Homing = true

## Freeze counts as a debuff and can execute bosses at 15% HP.
# Setting type: Boolean
# Default value: true
Freeze Executes Bosses = true

## Freeze execute threshold is reduced to 15% globally. Requires Freeze Executes Bosses.
# Setting type: Boolean
# Default value: false
Freeze Executes Bosses - Nerf Freeze Globally = false

## Replaces Voidtouched Collapse with Nullify.
# Setting type: Boolean
# Default value: true
Nerf Voidtouched = true

## Gives players health regen + armor when playing as monsters via mods.
# Setting type: Boolean
# Default value: true
Player-Controlled Monster Tweaks = true

## Void Reaver Nullify only takes 2 stacks to apply.
# Setting type: Boolean
# Default value: true
Nullify Buff = true

