Compatibility - Starstorm 2 = true

## Enables ally changes on allies from this mod.
# Setting type: Boolean
# Default value: true
Compatibility - Spikestrip = true

## Enables ally changes on allies from this mod.
# Setting type: Boolean
# Default value: true
Compatibility - Tinkers Satchel = true

## Enables ally changes on allies from this mod.
# Setting type: Boolean
# Default value: true
Compatibility - MoreDrones = true

[05. Artifacts]

## Increases drop chance when not using Swarms and prevents drop chance from increasing as the run progresses.
# Setting type: Boolean
# Default value: true
Sacrifice - No Drop Chance Scaling = true

